name: Verify and publish Agent Atlas website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical PDF edition and stage exact same bytes
        run: python3 scripts/stage_pdf.py
      - name: Validate website source and author links
        run: python3 scripts/check_site.py
      - name: Verify JavaScript syntax
        run: |
          node --check site/data.js
          node --check site/app.js
          node --check site/source-audit.js
      - name: Test source exports and original regression
        run: |
          node tests/source-audit.test.cjs
          python3 -m unittest discover -s tests -v
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical PDF and stage published bytes
        run: python3 scripts/stage_pdf.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-stage the identical historical PDF for byte comparison
        run: python3 scripts/stage_pdf.py
      - name: Compare nine actually published HTTPS files with repository SHA-256
        run: python3 scripts/verify_live.py
